name: Deploy WebAPI

on:
  push:
    branches: [development, main]
  workflow_dispatch:

jobs:
  deploy-api-dev:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WebAPI
        run: dotnet publish ./PSA.WebAPI/PSA.WebAPI.csproj -c Release -o ./publish-api

      - name: Deploy WebAPI (Development)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_API_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API_DEV }}
          package: ./publish-api

  deploy-api-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WebAPI
        run: dotnet publish ./PSA.WebAPI/PSA.WebAPI.csproj -c Release -o ./publish-api

      - name: Deploy WebAPI (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_API_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API_PROD }}
          package: ./publish-api
