name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore psa-costa-rica.slnx

      - name: Build
        run: dotnet build psa-costa-rica.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test psa-costa-rica.slnx --configuration Release --no-build
