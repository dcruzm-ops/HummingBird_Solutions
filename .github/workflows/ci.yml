name: psa-ci

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore psa-costa-rica.slnx

      - name: Build
        run: dotnet build psa-costa-rica.slnx --no-restore -c Release

      - name: Test
        run: dotnet test PSA.AppCore.Tests/PSA.AppCore.Tests.csproj --no-build -c Release
