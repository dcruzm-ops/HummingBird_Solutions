name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-webapi:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WebAPI
        run: dotnet publish PSA.WebAPI/PSA.WebAPI.csproj --configuration Release --output ./publish/webapi

      - name: Deploy WebAPI to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPI_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPI_PUBLISH_PROFILE }}
          package: ./publish/webapi

  deploy-webapp:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-webapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WebApp
        run: dotnet publish PSA.WebApp/PSA.WebApp.csproj --configuration Release --output ./publish/webapp

      - name: Deploy WebApp to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish/webapp
